name: Releases neu aufbauen (einmalig)

# Löscht alle Releases und Tags v* und legt sie neu an – jeweils auf dem
# ersten Commit von main, in dem die Version in haos_smart/config.yaml steht.
# Nötig nach dem Umschreiben der Versionsgeschichte. Danach wird diese Datei entfernt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Alte Releases und Tags löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            echo "Lösche Release $tag"; gh release delete "$tag" --yes --cleanup-tag
          done
          for tag in $(git ls-remote --tags origin 'v*' | sed 's#.*refs/tags/##; s#\^{}##' | sort -u); do
            echo "Lösche Tag $tag"; git push origin ":refs/tags/$tag" || true
          done
      - name: Releases neu anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seen=""
          for sha in $(git rev-list --reverse main); do
            v=$(git show "$sha:haos_smart/config.yaml" | sed -nE 's/^version: *"?([^"]+)"?.*/\1/p')
            case " $seen " in *" $v "*) continue ;; esac
            seen="$seen $v"; tag="v$v"
            notes=".github/releases/$tag.md"
            [ -f "$notes" ] || { awk -v v="$v" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' haos_smart/CHANGELOG.md > /tmp/n.md; notes=/tmp/n.md; }
            title="$tag"; [ "$v" = "0.3.0" ] && title="v0.3.0 – erste öffentliche Version"
            echo "Release $tag auf $sha"
            gh release create "$tag" --target "$sha" --title "$title" --notes-file "$notes" --latest=false
          done
          latest=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' haos_smart/config.yaml)
          gh release edit "v$latest" --latest
